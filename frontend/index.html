<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR University | Bus Management</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authView" class="auth-shell">
    <div class="auth-brand"><div class="brand-mark">SR</div><div><h1>SR University</h1><p>Transport Management Portal</p></div></div>
    <section class="auth-card">
      <div class="eyebrow">CAMPUS TRANSPORT</div><h2 id="authTitle">Welcome back</h2><p class="muted">Sign in to manage or track your university bus.</p>
      <div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="registerTab">Create account</button></div>
      <form id="authForm">
        <div id="nameField" class="field hidden"><label>Full name</label><input id="name" placeholder="Your full name"></div>
        <div class="field"><label>Email address</label><input id="email" type="email" required placeholder="you@sr.edu"></div>
        <div class="field"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
        <div id="roleField" class="field hidden"><label>Register as</label><select id="role"><option value="student">Student</option><option value="driver">Driver</option></select></div>
        <div id="contactField" class="field hidden"><label>Contact number</label><input id="contact" placeholder="Mobile number"></div>
        <div id="addressField" class="field hidden"><label>Residential area</label><input id="address" placeholder="Your area / locality"></div>
        <button class="primary full" type="submit" id="authSubmit">Login</button>
      </form>
      <p id="authMessage" class="message"></p>
    </section>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><div class="brand-mark">SR</div><div><b>SR University</b><small>Transport Portal</small></div></div>
      <div class="user-chip"><div class="avatar" id="avatar">U</div><div><b id="userName">User</b><small id="userRole">Role</small></div></div>
      <nav id="navigation"></nav>
      <button id="logoutBtn" class="logout">↪ &nbsp; Sign out</button>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">SR UNIVERSITY / TRANSPORT</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-right"><span class="online-dot"></span><span>Demo system</span><div class="avatar small" id="topAvatar">U</div></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body></html>
